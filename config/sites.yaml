# 求人媒体 → 法人マスター同期の設定
#
# `task_id` は Octoparse MCP 経由で Claude Code にタスクを作成させた後に埋める。
# `field_map` の左辺は Octoparse のフィールド名（媒体の HTML に合わせて Octoparse で設定した名前）、
# 右辺は Google Sheets 法人マスターのヘッダー名。

sheet:
  id: "1IhKsPixhjJqUb0fvbG4wJ18hvXTkwhTGljYJvfpx0bY"
  gid: 1047720461
  key_columns: ["会社名"]
  match_columns: ["都道府県", "電話番号"]
  max_jobs_per_company: 3

sites:
  rikunabi_next:
    task_id: ""
    template: "rikunabi-next-job-scraper"
    display_name: "リクナビNEXT"
    field_map:
      会社名: 会社名
      所在地: 所在地
      都道府県: 都道府県
      電話番号: 電話番号
      コーポレートURL: URL
      業種: 業種
      従業員数: 従業員数
      資本金: 資本金
      設立: 設立年
      代表者: 代表者名
