[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kindle-screenshot"
version = "0.1.0"
description = "Kindleアプリのスクリーンショットを撮影するツール"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
keywords = ["kindle", "screenshot", "automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics :: Capture :: Screen Capture",
]

dependencies = [
    "pyautogui>=0.9.54",
    "pillow>=10.0.0",
    "imagehash>=4.3.0",
    "pygetwindow>=0.0.9; sys_platform == 'win32' or sys_platform == 'darwin'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
kindle-screenshot = "kindle_screenshot.screenshot:main"

[project.urls]
Homepage = "https://github.com/popopo1010/box"
Repository = "https://github.com/popopo1010/box"

[tool.setuptools.packages.find]
where = ["."]
include = ["kindle_screenshot*"]

[tool.black]
line-length = 88
target-version = ['py39', 'py310', 'py311', 'py312']

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = []
